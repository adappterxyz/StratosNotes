[package]
name = "flow-engine"
version = "0.1.0"
description = "StratosNotes workflow engine: runs compiled BPMN workflows (structured products) on Solana, driven by Chainlink CRE"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "flow_engine"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
